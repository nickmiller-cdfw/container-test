# This is a basic workflow to help you get started with Actions

name: Build and publish basespace CLI container

on:
  push:
  # Or target specific branches/tags
    branches: [ "main" ]

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build SIF Image
        run: |
          apptainer build basespace.sif basespace.def

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | apptainer remote login -u ${{ github.actor }} --password-stdin oras://ghcr.io

      - name: Push Container to GHCR
        run: |
          IMAGE_TAG=ghcr.io/${{ github.repository }}:latest
          apptainer push basespace.sif oras://$IMAGE_TAG
